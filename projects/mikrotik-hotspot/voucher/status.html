<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="refresh" content="60">
<title>$(hostname) — Status</title>
<style>
  :root{--brand:#5457e6;--brand-dark:#3a3ccc;--bg:#eef0fb;--card:#fff;--fg:#191a2e;--muted:#6b7280;--line:#e6e8f2;--ok:#2f9e6b;--danger:#c0392b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);min-height:100vh;
    display:grid;place-items:center;padding:24px;
    background:radial-gradient(680px 500px at 8% 6%,rgba(84,87,230,.16),transparent 60%),radial-gradient(640px 480px at 96% 100%,rgba(139,123,232,.16),transparent 60%),var(--bg)}
  .card{width:min(420px,100%);background:var(--card);border-radius:24px;padding:32px 28px;box-shadow:0 34px 64px -30px rgba(30,25,80,.45)}
  .head{display:flex;align-items:center;gap:12px}
  .logo{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
  .head h2{font-size:1.2rem;font-weight:800}
  .badge{display:inline-flex;align-items:center;gap:7px;background:#e7f6ee;color:var(--ok);font-size:.8rem;font-weight:700;padding:6px 12px;border-radius:999px;margin:14px 0 20px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .cell{background:#fff;padding:13px 15px}.cell.full{grid-column:1/-1}
  .cell .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .cell .v{font-size:1rem;font-weight:700;margin-top:3px;word-break:break-word}
  .btn{display:block;text-align:center;text-decoration:none;margin-top:20px;padding:14px;border-radius:14px;background:var(--danger);color:#fff;font-weight:800}
  .btn:hover{filter:brightness(1.05)}
  .foot{margin-top:16px;text-align:center;font-size:.76rem;color:var(--muted)}
  .credit{margin-top:12px;text-align:center;font-size:.74rem;color:#aeb2c8}.credit a{color:var(--brand);text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="head"><div class="logo">CO</div><h2>Status Koneksi</h2></div>
    <span class="badge"><span class="dot"></span> Terhubung</span>
    <div class="grid">
      <div class="cell full"><div class="k">Akun</div><div class="v">$(username)</div></div>
      <div class="cell"><div class="k">Alamat IP</div><div class="v">$(ip)</div></div>
      <div class="cell"><div class="k">MAC</div><div class="v">$(mac)</div></div>
      <div class="cell"><div class="k">Lama Terhubung</div><div class="v">$(uptime)</div></div>
      <div class="cell"><div class="k">Sisa Waktu</div><div class="v">$(session-time-left)</div></div>
      <div class="cell"><div class="k">Data Turun</div><div class="v">$(bytes-in-nice)</div></div>
      <div class="cell"><div class="k">Data Naik</div><div class="v">$(bytes-out-nice)</div></div>
    </div>
    <a class="btn" href="$(link-logout)">Keluar (Logout)</a>
    <div class="foot">Halaman menyegar otomatis tiap 60 detik.</div>
    <div class="credit">Template oleh <a href="https://instagram.com/arschbx" target="_blank" rel="noopener">@arschbx</a> · <a href="https://github.com/Tessa-stuck" target="_blank" rel="noopener">Tessa-stuck</a></div>
  </div>
</body>
</html>
