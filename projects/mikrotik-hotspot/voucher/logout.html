<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>$(hostname) — Keluar</title>
<style>
  :root{--brand:#5457e6;--brand-dark:#3a3ccc;--bg:#eef0fb;--card:#fff;--fg:#191a2e;--muted:#6b7280;--line:#e6e8f2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);min-height:100vh;
    display:grid;place-items:center;padding:24px;
    background:radial-gradient(680px 500px at 8% 6%,rgba(84,87,230,.16),transparent 60%),radial-gradient(640px 480px at 96% 100%,rgba(139,123,232,.16),transparent 60%),var(--bg)}
  .card{width:min(400px,100%);background:var(--card);border-radius:24px;padding:38px 30px;box-shadow:0 34px 64px -30px rgba(30,25,80,.45);text-align:center}
  .icon{width:70px;height:70px;border-radius:50%;background:#eef0f8;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
  .icon svg{width:34px;height:34px;stroke:var(--brand);stroke-width:2;fill:none}
  h2{font-size:1.4rem;font-weight:800}
  p{color:var(--muted);margin-top:8px;font-size:.95rem}
  .stats{display:flex;gap:10px;margin:22px 0}
  .stat{flex:1;background:#f6f7fc;border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .stat .v{font-size:.98rem;font-weight:700;margin-top:3px}
  .btn{display:block;text-decoration:none;padding:14px;border-radius:14px;background:var(--brand);color:#fff;font-weight:800}
  .btn:hover{background:var(--brand-dark)}
  .credit{margin-top:18px;font-size:.74rem;color:#aeb2c8}.credit a{color:var(--brand);text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
    <h2>Sampai Jumpa 👋</h2>
    <p>Sesi WiFi kamu sudah berakhir. Terima kasih!</p>
    <div class="stats">
      <div class="stat"><div class="k">Total Turun</div><div class="v">$(bytes-in-nice)</div></div>
      <div class="stat"><div class="k">Total Naik</div><div class="v">$(bytes-out-nice)</div></div>
    </div>
    <a class="btn" href="$(link-login)">Masuk Lagi</a>
    <div class="credit">Template oleh <a href="https://instagram.com/arschbx" target="_blank" rel="noopener">@arschbx</a> · <a href="https://github.com/Tessa-stuck" target="_blank" rel="noopener">Tessa-stuck</a></div>
  </div>
</body>
</html>
