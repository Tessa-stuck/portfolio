<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="refresh" content="2; url=$(link-redirect)">
<title>$(hostname) — Terhubung</title>
<style>
  :root{--brand:#2f7a54;--brand-dark:#1f5c3d;--bg:#eef2ec;--card:#fff;--fg:#1a2620;--muted:#6b7c72;--line:#e4e9e1;--ok:#2f7a54}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);min-height:100vh;
    display:grid;place-items:center;padding:24px;text-align:center;
    background:radial-gradient(680px 500px at 10% 6%,rgba(122,148,80,.24),transparent 62%),radial-gradient(620px 480px at 94% 8%,rgba(47,122,84,.20),transparent 62%),var(--bg)}
  .card{width:min(400px,100%);background:var(--card);border-radius:24px;padding:38px 30px;box-shadow:0 30px 60px -28px rgba(20,45,30,.4)}
  .check{width:78px;height:78px;border-radius:50%;background:#e6f0ea;border:2px solid var(--ok);margin:0 auto 22px;display:flex;align-items:center;justify-content:center}
  .check svg{width:38px;height:38px;stroke:var(--ok);stroke-width:3;fill:none;stroke-dasharray:48;stroke-dashoffset:48;animation:draw .5s ease forwards .1s}
  @keyframes draw{to{stroke-dashoffset:0}}
  h1{font-size:1.5rem;font-weight:800}
  p{color:var(--muted);margin-top:10px}
  .spinner{margin:22px auto 0;width:26px;height:26px;border:3px solid #dfe6db;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  a{color:var(--brand);font-weight:700}
  .fallback{margin-top:20px;font-size:.85rem;color:var(--muted)}
  .credit{margin-top:26px;font-size:.74rem;color:#a4b0a6}.credit a{color:var(--brand);text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="check"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"></polyline></svg></div>
    <h1>Berhasil Terhubung ☕</h1>
    <p>Selamat menikmati, <strong>$(username)</strong>. Kamu sedang dialihkan…</p>
    <div class="spinner"></div>
    <div class="fallback">Tidak dialihkan otomatis? <a href="$(link-redirect)">Klik di sini</a>.</div>
    <div class="credit">Template oleh <a href="https://instagram.com/arschbx" target="_blank" rel="noopener">@arschbx</a> · <a href="https://github.com/Tessa-stuck" target="_blank" rel="noopener">Tessa-stuck</a></div>
  </div>
</body>
</html>
