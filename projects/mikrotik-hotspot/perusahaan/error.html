<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>$(hostname) — Terjadi Kesalahan</title>
<style>
  :root{
    --brand:#1e40af;--brand-dark:#1e3a8a;--bg:#0f172a;--card:#fff;--fg:#0f172a;
    --muted:#64748b;--line:#e2e8f0;--danger:#dc2626;--danger-bg:#fef2f2;--radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;background:linear-gradient(135deg,var(--brand-dark),var(--bg));
  }
  .card{width:min(420px,100%);background:var(--card);border-radius:18px;padding:38px 32px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.5);text-align:center}
  .icon{width:70px;height:70px;border-radius:50%;background:var(--danger-bg);margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center}
  .icon svg{width:36px;height:36px;stroke:var(--danger);stroke-width:2.2;fill:none}
  h2{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
  .msg{background:var(--danger-bg);border:1px solid #fecaca;color:var(--danger);
    padding:12px 16px;border-radius:10px;font-size:.92rem;font-weight:500;margin:18px 0}
  p{color:var(--muted);font-size:.92rem}
  .btn{display:block;text-decoration:none;padding:14px;border-radius:10px;background:var(--brand);
    color:#fff;font-weight:700;font-size:1rem;margin-top:22px}
  .btn:hover{background:var(--brand-dark)}
  .credit{margin-top:20px;font-size:.74rem;color:#94a3b8}
  .credit a{color:var(--brand);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <h2>Terjadi Kesalahan</h2>
    <div class="msg">$(error)</div>
    <p>Silakan coba masuk kembali. Jika masalah berlanjut, hubungi IT Helpdesk.</p>
    <a class="btn" href="$(link-login)">Kembali ke Halaman Login</a>
    <div class="credit">
      Template oleh <a href="https://instagram.com/arschbx" target="_blank" rel="noopener">@arschbx</a>
      · <a href="https://github.com/Tessa-stuck" target="_blank" rel="noopener">Tessa-stuck</a>
    </div>
  </div>
</body>
</html>
