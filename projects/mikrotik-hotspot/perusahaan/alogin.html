<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="refresh" content="2; url=$(link-redirect)">
<title>$(hostname) — Berhasil Masuk</title>
<style>
  :root{--brand:#1e40af;--brand-dark:#1e3a8a;--bg:#0f172a;--ok:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;
    background:linear-gradient(135deg,var(--brand-dark),var(--bg));text-align:center;
  }
  .box{max-width:380px}
  .check{
    width:76px;height:76px;border-radius:50%;background:rgba(22,163,74,.15);
    border:2px solid var(--ok);margin:0 auto 22px;display:flex;align-items:center;justify-content:center;
  }
  .check svg{width:38px;height:38px;stroke:var(--ok);stroke-width:3;fill:none;
    stroke-dasharray:48;stroke-dashoffset:48;animation:draw .5s ease forwards .1s}
  @keyframes draw{to{stroke-dashoffset:0}}
  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
  p{color:rgba(255,255,255,.7);margin-top:10px;font-size:.98rem}
  .spinner{margin:22px auto 0;width:26px;height:26px;border:3px solid rgba(255,255,255,.2);
    border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  a{color:#fff;font-weight:600}
  .fallback{margin-top:20px;font-size:.85rem;color:rgba(255,255,255,.6)}
  .credit{margin-top:26px;font-size:.74rem;color:rgba(255,255,255,.45)}
  .credit a{color:rgba(255,255,255,.7);text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"></polyline></svg>
    </div>
    <h1>Berhasil Masuk</h1>
    <p>Selamat datang, <strong>$(username)</strong>. Anda sedang dialihkan…</p>
    <div class="spinner"></div>
    <div class="fallback">
      Tidak dialihkan otomatis? <a href="$(link-redirect)">Klik di sini</a>.
    </div>
    <div class="credit">
      Template oleh <a href="https://instagram.com/arschbx" target="_blank" rel="noopener">@arschbx</a>
      · <a href="https://github.com/Tessa-stuck" target="_blank" rel="noopener">Tessa-stuck</a>
    </div>
  </div>
</body>
</html>
