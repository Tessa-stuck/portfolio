<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>$(hostname) — Keluar</title>
<style>
  :root{
    --brand:#1e40af;--brand-dark:#1e3a8a;--bg:#0f172a;--card:#fff;--fg:#0f172a;
    --muted:#64748b;--line:#e2e8f0;--radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;background:linear-gradient(135deg,var(--brand-dark),var(--bg));
  }
  .card{width:min(420px,100%);background:var(--card);border-radius:18px;padding:38px 32px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.5);text-align:center}
  .icon{width:70px;height:70px;border-radius:50%;background:#f1f5f9;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center}
  .icon svg{width:34px;height:34px;stroke:var(--muted);stroke-width:2;fill:none}
  h2{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
  p{color:var(--muted);margin-top:8px;font-size:.96rem}
  .stats{display:flex;gap:10px;margin:22px 0}
  .stat{flex:1;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .stat .v{font-size:.98rem;font-weight:700;margin-top:3px}
  .btn{display:block;text-decoration:none;padding:14px;border-radius:10px;background:var(--brand);
    color:#fff;font-weight:700;font-size:1rem}
  .btn:hover{background:var(--brand-dark)}
  .credit{margin-top:20px;font-size:.74rem;color:#94a3b8}
  .credit a{color:var(--brand);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <h2>Anda Telah Keluar</h2>
    <p>Sesi WiFi Anda sudah berakhir. Terima kasih.</p>

    <div class="stats">
      <div class="stat">
        <div class="k">Total Unduh</div>
        <div class="v">$(bytes-in-nice)</div>
      </div>
      <div class="stat">
        <div class="k">Total Unggah</div>
        <div class="v">$(bytes-out-nice)</div>
      </div>
    </div>

    <a class="btn" href="$(link-login)">Masuk Lagi</a>
    <div class="credit">
      Template oleh <a href="https://instagram.com/arschbx" target="_blank" rel="noopener">@arschbx</a>
      · <a href="https://github.com/Tessa-stuck" target="_blank" rel="noopener">Tessa-stuck</a>
    </div>
  </div>
</body>
</html>
