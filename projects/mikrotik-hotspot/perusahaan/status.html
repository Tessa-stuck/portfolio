<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="refresh" content="60">
<title>$(hostname) — Status Koneksi</title>
<style>
  :root{
    --brand:#1e40af;--brand-dark:#1e3a8a;--bg:#0f172a;--card:#fff;--fg:#0f172a;
    --muted:#64748b;--line:#e2e8f0;--ok:#16a34a;--ok-bg:#f0fdf4;--danger:#dc2626;--radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;background:linear-gradient(135deg,var(--brand-dark),var(--bg));
  }
  .card{width:min(460px,100%);background:var(--card);border-radius:18px;padding:36px 32px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
  .head h2{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
  .badge{display:inline-flex;align-items:center;gap:7px;background:var(--ok-bg);color:var(--ok);
    font-size:.82rem;font-weight:700;padding:6px 12px;border-radius:999px;margin:14px 0 22px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(22,163,74,.15)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cell{background:#fff;padding:14px 16px}
  .cell .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .cell .v{font-size:1.02rem;font-weight:700;margin-top:3px;word-break:break-word}
  .cell.full{grid-column:1 / -1}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;margin-top:22px;
    padding:14px;border-radius:10px;background:var(--danger);color:#fff;font-weight:700;font-size:1rem}
  .btn:hover{background:#b91c1c}
  .foot{margin-top:18px;text-align:center;font-size:.78rem;color:var(--muted)}
  .credit{margin-top:14px;text-align:center;font-size:.74rem;color:#94a3b8}
  .credit a{color:var(--brand);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="logo">CO</div>
      <h2>Status Koneksi</h2>
    </div>
    <span class="badge"><span class="dot"></span> Terhubung</span>

    <div class="grid">
      <div class="cell full">
        <div class="k">Username</div>
        <div class="v">$(username)</div>
      </div>
      <div class="cell">
        <div class="k">Alamat IP</div>
        <div class="v">$(ip)</div>
      </div>
      <div class="cell">
        <div class="k">MAC</div>
        <div class="v">$(mac)</div>
      </div>
      <div class="cell">
        <div class="k">Lama Terhubung</div>
        <div class="v">$(uptime)</div>
      </div>
      <div class="cell">
        <div class="k">Sisa Waktu</div>
        <div class="v">$(session-time-left)</div>
      </div>
      <div class="cell">
        <div class="k">Data Diunduh</div>
        <div class="v">$(bytes-in-nice)</div>
      </div>
      <div class="cell">
        <div class="k">Data Diunggah</div>
        <div class="v">$(bytes-out-nice)</div>
      </div>
    </div>

    <a class="btn" href="$(link-logout)">Keluar (Logout)</a>
    <div class="foot">Halaman ini menyegar otomatis tiap 60 detik.</div>
    <div class="credit">
      Template oleh <a href="https://instagram.com/arschbx" target="_blank" rel="noopener">@arschbx</a>
      · <a href="https://github.com/Tessa-stuck" target="_blank" rel="noopener">Tessa-stuck</a>
    </div>
  </div>
</body>
</html>
